      />

      <div class="cloud-field" aria-hidden="true">
        <img
          class="floating-cloud floating-cloud--far"
          src="assets/cloud-realistic.png"
          alt=""
          draggable="false"
        />
        <img
          class="floating-cloud floating-cloud--middle"
          src="assets/cloud-realistic.png"
          alt=""
          draggable="false"
        />
        <img
          class="floating-cloud floating-cloud--near"
          src="assets/cloud-realistic.png"
          alt=""
          draggable="false"
        />
      </div>

      <img
        class="landing__logo"
        src="assets/hnch-wordmark-white.svg"
        width="888"
        height="181"
        alt="HNCH"
        data-node-id="1:20735"
      />

      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" data-node-id="1:20734">
          <span>never miss out</span>

        <a
          class="download-button"
          href="https://apps.apple.com/app/apple-store/id6764042802?pt=129186659&amp;ct=website&amp;mt=8"
          data-app-store
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Download HNCH for iOS on the App Store"
          data-node-id="1:20738"
        >
          <img
            src="assets/apple-icon.svg"
            width="24"
            height="24"
            alt=""
            aria-hidden="true"
            data-node-id="1:20740"
          />
          <span data-node-id="1:20742">Download for iOS</span>
        </a>
      </section>

    <footer class="site-footer">

      <a class="site-footer__brand" href="/" aria-label="HNCH home">
        <img
          src="assets/hnch-wordmark-white.svg"
          width="888"

        />

      <nav class="site-footer__nav" aria-label="Footer navigation">
        <section class="footer-group footer-group--company">
          <h2>Company</h2>
          <a href="/terms-of-service/">Terms of Service</a>
